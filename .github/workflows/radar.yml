name: Scan radar
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: radar
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scan.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python3 audit.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python3 jobs.py
      - run: |
          git config user.name 'radar-bot'
          git config user.email 'radar-bot@users.noreply.github.com'
          git add docs/results.json docs/audits.json docs/jobs.json
          git diff --cached --quiet || (git commit -m 'Update discovery feed' && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
